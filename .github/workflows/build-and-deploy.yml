name: Build Images & Deploy to Kubernetes

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  MELTANO_IMAGE: ghcr.io/sean-stock/seanstock-data-platform-meltano
  SUPERSET_IMAGE: ghcr.io/sean-stock/seanstock-data-platform-superset

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up QEMU (multi-arch arm64/amd64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push Meltano ELT image
        uses: docker/build-push-action@v6
        with:
          context: ./meltano
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.MELTANO_IMAGE }}:latest
            ${{ env.MELTANO_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build & push Apache Superset image
        uses: docker/build-push-action@v6
        with:
          context: ./superset
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.SUPERSET_IMAGE }}:latest
            ${{ env.SUPERSET_IMAGE }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy-k8s:
    needs: build-and-push
    runs-on: ubuntu-latest
    # Runs only when KUBE_CONFIG_DATA secret is configured
    if: ${{ secrets.KUBE_CONFIG_DATA != '' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.KUBE_CONFIG_DATA }}" | base64 -d > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply Kustomize manifests
        run: |
          kubectl apply -k k8s/
          kubectl -n data-showcase rollout restart deployment/superset
          kubectl -n data-showcase rollout status deployment/superset --timeout=180s
