# Copy to k8s/secrets.yaml (gitignored) or create via kubectl create secret:
#
#   kubectl -n data-showcase create secret generic platform-secrets \
#     --from-literal=POSTGRES_PASSWORD="$(openssl rand -hex 24)" \
#     --from-literal=SUPERSET_SECRET_KEY="$(openssl rand -base64 42)" \
#     --from-literal=SUPERSET_GUEST_TOKEN_SECRET="$(openssl rand -base64 42)" \
#     --from-literal=SUPERSET_ADMIN_USER="admin" \
#     --from-literal=SUPERSET_ADMIN_PASSWORD="CHANGE_ME" \
#     --from-literal=SUPERSET_EMBED_USER="embed_service" \
#     --from-literal=SUPERSET_EMBED_PASSWORD="CHANGE_ME" \
#     --from-literal=CLOUDFLARED_TUNNEL_TOKEN="YOUR_CLOUDFLARE_TUNNEL_TOKEN"
#
apiVersion: v1
kind: Secret
metadata:
  name: platform-secrets
  namespace: data-showcase
type: Opaque
stringData:
  POSTGRES_PASSWORD: "REPLACE_WITH_STRONG_PASSWORD"
  SUPERSET_SECRET_KEY: "REPLACE_WITH_OPENSSL_RAND_BASE64_42"
  SUPERSET_GUEST_TOKEN_SECRET: "REPLACE_WITH_OPENSSL_RAND_BASE64_42"
  SUPERSET_ADMIN_USER: "admin"
  SUPERSET_ADMIN_PASSWORD: "REPLACE_WITH_ADMIN_PASSWORD"
  SUPERSET_EMBED_USER: "embed_service"
  SUPERSET_EMBED_PASSWORD: "REPLACE_WITH_EMBED_SERVICE_PASSWORD"
  CLOUDFLARED_TUNNEL_TOKEN: "REPLACE_WITH_CLOUDFLARE_TUNNEL_TOKEN"
